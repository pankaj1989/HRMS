# OSV-Scanner ignore list.
# Each entry MUST carry a justification and a hard expiration date.
# After the expiration the advisory re-fails the build, forcing remediation.
#
# All ignores expire 2026-06-30 (60 days from P1.1.5 landing on 2026-05-01).
# Two groups, both deferred to follow-up sub-phases:
#
#   Group A — multer 1.x (P1.1.5b): migrating to multer 2.x is a breaking API
#   rewrite. Tracked separately so the migration can get its own test coverage.
#
#   Group B — major bumps explicitly out of scope of P1.1.5 per spec:
#     - @nestjs/core 11.x  (P1.1.5c NestJS-major migration)
#     - vite 6.x           (P1.1.5d vite/vitest-major migration)
#     - file-type 21.x     (transitive of fastify-multipart; bumped together
#                           with NestJS 11.x or via override after testing)
#
# All Group B advisories are CVSS 6.3 or below (no Critical, no High);
# acceptable to defer for a 60-day window.

